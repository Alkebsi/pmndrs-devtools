<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PMNDRS DevTools demo</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b0b0f;
        color: #777;
        font:
          13px system-ui,
          sans-serif;
      }
      #box {
        width: 120px;
        height: 120px;
        border-radius: 18px;
        background: #ff4f87;
        animation: spin 4s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="box"></div>
    <script type="module" src="./src/app.ts"></script>
  </body>
</html>
